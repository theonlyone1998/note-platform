# 纸间笔记平台 - 线上 Nginx 入口配置（方案 A：单机部署）
# 用法：cp nginx.conf /etc/nginx/conf.d/note-platform.conf
# 然后：nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name {{DOMAIN}};

    # 自动跳 HTTPS，没有证书可以注释掉下面整个 return 块并改用 80 端口静态服务
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name {{DOMAIN}};

    # SSL 证书路径（部署前请替换为真实路径）
    ssl_certificate {{CERT_PATH}};
    ssl_certificate_key {{KEY_PATH}};

    # SSL 安全加固
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
        root {{CLIENT_DIST}};
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 与后端接口统一反代
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 部署后可用 /api/health 做探活
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 前端 Vue Router history 模式：所有未命中路由回退到 index.html
    location / {
        root {{CLIENT_DIST}};
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
